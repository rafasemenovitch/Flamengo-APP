<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Mapa do estádio · desenvolvimento</title>
    <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
    <style>
      html, body, #map { margin: 0; height: 100%; overflow: hidden; }
      body { font-family: 'Schibsted Grotesk Medium', -apple-system, system-ui, sans-serif; }
      /* Atribuição discreta, no canto */
      .maplibregl-ctrl-attrib { font-size: 9.5px; line-height: 1.5; background: transparent !important; }
      .maplibregl-ctrl-attrib a { color: inherit !important; }
      #map[data-theme='light'] .maplibregl-ctrl-attrib { color: #8b8a86; }
      #map[data-theme='dark'] .maplibregl-ctrl-attrib { color: #76767e; }
      .box {
        position: absolute; left: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
        max-width: 370px; padding: 8px; border-radius: 12px; background: rgba(21, 21, 24, 0.88);
        color: #f5f5f4; font-size: 12px;
      }
      #panel { top: 10px; }
      #card { bottom: 28px; right: 10px; max-width: none; display: block; line-height: 1.45; }
      [hidden] { display: none !important; }
      .box b { font-family: 'Schibsted Grotesk Bold', system-ui; }
      #panel button, #panel select, #panel input {
        font: inherit; color: inherit; background: #26262b; border: 1px solid #3a3a42; border-radius: 8px;
        padding: 5px 8px; cursor: pointer;
      }
      #panel input { width: 54px; cursor: text; }
      #panel button[aria-pressed='true'] { background: #c8102e; border-color: #c8102e; }
      #panel .sep { width: 100%; height: 0; }
      #panel output { width: 100%; color: #a6a6ad; font-size: 11px; }
      #card small { color: #a6a6ad; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel" class="box" hidden>
      <button data-theme="light">Claro</button>
      <button data-theme="dark">Escuro</button>
      <button id="tiles">Sem tiles</button>
      <button id="recenter">Recentralizar</button>
      <span class="sep"></span>
      <span id="levels"></span>
      <span class="sep"></span>
      <label>Onde você está? <select id="area"><option value="">—</option></select></label>
      <input id="block" placeholder="bloco" inputmode="numeric" />
      <span class="sep"></span>
      <button data-filter="banheiros">Banheiros</button>
      <button data-filter="acessibilidade">Acessibilidade</button>
      <output id="cam"></output>
    </div>
    <div id="card" class="box" hidden></div>
    <script src="./build/main.js"></script>
  </body>
</html>
